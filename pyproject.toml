[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sakura-miner"
version = "0.1.0"
description = "turn any Japanese text into Anki flashcards, with meanings, readings and JLPT tags"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fugashi",
    "unidic-lite",
    "jaconv",
    "jamdict",
    # jamdict-data 1.5 fails to install on Windows (WinError 32); the -fix
    # package is the same data with the install script corrected
    "jamdict-data; sys_platform != 'win32'",
    "jamdict-data-fix==1.5.1a2; sys_platform == 'win32'",
    "genanki",
    "click",
]

[project.scripts]
sakura-miner = "sakura_miner.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.hatch.build.targets.wheel]
packages = ["src/sakura_miner"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
